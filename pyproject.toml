[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bosch-etch-virtual-metrology"
version = "0.1.0"
description = "Lot-grouped virtual metrology experiments for public BOSCH plasma-etch data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Changpeng Fan"},
]
license = "MIT"
keywords = [
  "semiconductor manufacturing",
  "virtual metrology",
  "plasma etching",
  "BOSCH process",
  "grouped cross-validation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "h5py>=3.14,<4",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.7,<1.8",
  "scipy>=1.15,<2",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
bosch-vm = "bosch_vm.cli:main"

[project.urls]
Repository = "https://github.com/cpngfan-ui/bosch-etch-virtual-metrology"
Documentation = "https://github.com/cpngfan-ui/bosch-etch-virtual-metrology#readme"
Data = "https://doi.org/10.5281/zenodo.17122442"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
